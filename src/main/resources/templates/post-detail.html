<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${post.title})}"></head>
<body th:with="canManage=${currentUser != null and (currentUser.role.name() == 'ADMIN' or (post.author != null and post.author.id == currentUser.id))}">
<header th:replace="~{layout :: header}"></header>

<div th:if="${message}" class="flash" th:text="${message}"></div>

<article>
  <h1 th:text="${post.title}">Post title</h1>
  <p class="meta">
    by <span th:text="${post.author != null ? post.author.name : 'Unknown'}">Author</span>
    <span th:if="${post.publishedAt != null}"
          th:text="'· ' + ${#temporals.format(post.publishedAt, 'dd MMM yyyy')}">· date</span>
  </p>
  <div>
    <span class="tag" th:each="tag : ${post.tags}" th:text="${tag.name}">tag</span>
  </div>
  <div th:text="${post.content}" style="margin-top: 1rem;">Content…</div>

  <!-- Edit / Delete: only the post's author or an admin -->
  <p style="margin-top: 1rem;" th:if="${canManage}">
    <a th:href="@{/posts/{id}/edit(id=${post.id})}">Edit</a>
    &nbsp;|&nbsp;
  <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
        style="display:inline;" onsubmit="return confirm('Delete this post?');">
    <button type="submit">Delete</button>
  </form>
  </p>
</article>

<hr>

<section>
  <h2>Comments</h2>
  <p th:if="${post.comments.isEmpty()}">No comments yet. Be the first!</p>

  <div th:each="comment : ${post.comments}" style="margin-bottom: 1rem;">
    <p style="margin-bottom: 0.2rem;">
      <strong th:text="${comment.name}">Name</strong>
      <span class="meta" th:if="${comment.createdAt != null}"
            th:text="'· ' + ${#temporals.format(comment.createdAt, 'dd MMM yyyy, HH:mm')}">date</span>
    </p>
    <p th:text="${comment.comment}" style="margin-top: 0;">Comment body…</p>

    <!-- Moderation: only the post's author or an admin -->
    <p style="margin-top: 0;" th:if="${canManage}">
      <a th:href="@{/comments/{id}/edit(id=${comment.id})}">Edit</a>
      &nbsp;|&nbsp;
    <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post"
          style="display:inline;" onsubmit="return confirm('Delete this comment?');">
      <button type="submit">Delete</button>
    </form>
    </p>
  </div>

  <h3>Add a comment</h3>
  <form th:action="@{/posts/{id}/comments(id=${post.id})}" th:object="${commentForm}" method="post">
    <label>Name
      <input type="text" th:field="*{name}">
    </label>
    <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">name error</span>

    <label>Email
      <input type="email" th:field="*{email}">
    </label>
    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">email error</span>

    <label>Comment
      <textarea th:field="*{comment}" rows="3"></textarea>
    </label>
    <span class="error" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}">comment error</span>

    <button type="submit">Post Comment</button>
  </form>
</section>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
