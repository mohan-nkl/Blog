<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Blog</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto;
            padding: 0 1rem; line-height: 1.6; color: #222; }
        a { color: #2563eb; text-decoration: none; } a:hover { text-decoration: underline; }
        nav { display: flex; gap: 1rem; align-items: center; padding-bottom: 1rem;
            border-bottom: 1px solid #eee; margin-bottom: 1.5rem; }
        .meta { color: #666; font-size: 0.9rem; }
        .tag { display: inline-block; background: #eef2ff; color: #4338ca; padding: 0.1rem 0.5rem;
            border-radius: 4px; font-size: 0.8rem; margin-right: 0.25rem; }
        .flash { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
            padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .error { color: #b91c1c; font-size: 0.85rem; }
        label { display: block; margin-top: 0.75rem; font-weight: 600; }
        input[type=text], input[type=email], textarea, select {
            width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
        button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
        .pagination { display: flex; gap: 1rem; margin-top: 1.5rem; align-items: center; }
        .nav-right { margin-left: auto; display: flex; gap: 1rem; align-items: center; }
        .nav-right form { margin: 0; }
        .nav-right button { margin: 0; padding: 0.3rem 0.7rem; }
    </style>
</head>
<body>
<header th:fragment="header">
    <nav>
        <a th:href="@{/}">Blog Home</a>
        <a th:href="@{/posts/new}" th:if="${currentUser != null}">New Post</a>

        <!-- Logged in: greeting + logout -->
        <span class="nav-right" th:if="${currentUser != null}">
            <span class="meta">Hi, <span th:text="${currentUser.name}">Name</span></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </span>

        <!-- Logged out: login link -->
        <span class="nav-right" th:unless="${currentUser != null}">
            <a th:href="@{/login}">Login</a>
        </span>
    </nav>
</header>
<footer th:fragment="footer">
    <hr>
    <p class="meta">Blog Application</p>
</footer>
</body>
</html>
